<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connector Finder</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; max-width: 700px; }
    #tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tool { padding: 8px 12px; border: 3px solid transparent; border-radius: 6px;
            cursor: pointer; font-size: 14px; }
    .tool.selected { border-color: #000; }
    canvas { border: 1px solid #888; touch-action: none; cursor: crosshair; max-width: 100%; }
    #shapes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
    .shape { padding: 6px 10px; border: 2px solid #888; border-radius: 6px; background: #f4f4f4;
             cursor: pointer; font-size: 14px; }
    .shape.selected { border-color: #000; background: #dde8ff; }
    #brush { margin-bottom: 12px; font-size: 14px; }
    #counts { margin: 10px 0; font-size: 14px; color: #333; }
    button.action { padding: 8px 14px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Connector Finder</h1>
  <p>Pick an element, then paint freehand, or pick a shape and drag a box on the grid.</p>

  <div id="tools"></div>
  <div id="shapes">
    <strong>Shape:</strong>
    <label><input type="checkbox" id="filled"> Filled</label>
  </div>
  <div id="brush">
    <strong>Freehand brush size:</strong>
    <select id="brushSize">
      <option value="1">1 (single cell)</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="5">5</option>
      <option value="8">8</option>
    </select>
  </div>
  <canvas id="grid"></canvas>
  <div id="counts"></div>
  <button class="action" id="clear">Clear grid</button>

  <script>
    // The drawing is a 32 x 32 grid. Each cell holds one number saying what is in it.
    const GRID_SIZE = 32;
    const CELL_PIXELS = 18;

    // Each element type has a number (stored in the grid), a name and a colour.
    const ELEMENTS = [
      { id: 0, name: "Eraser (empty)",   colour: "#ffffff", text: "#000" },
      { id: 1, name: "Plastic housing", colour: "#4a4a4a", text: "#fff" },
      { id: 2, name: "Metal shell",   colour: "#b8c0c8", text: "#000" },
      { id: 3, name: "Pin",     colour: "#e0a800", text: "#000" },
      { id: 4, name: "Socket",  colour: "#1f6feb", text: "#fff" },
      { id: 5, name: "Key",     colour: "#d93025", text: "#fff" },
    ];

    // grid[row][column] -> element id. Starts all Empty (0).
    let grid = [];
    function makeEmptyGrid() {
      grid = [];
      for (let row = 0; row < GRID_SIZE; row++) {
        grid.push(new Array(GRID_SIZE).fill(0));
      }
    }

    let selectedId = 1;
    const canvas = document.getElementById("grid");
    const ctx = canvas.getContext("2d");
    canvas.width = GRID_SIZE * CELL_PIXELS;
    canvas.height = GRID_SIZE * CELL_PIXELS;

    function draw() {
      for (let row = 0; row < GRID_SIZE; row++) {
        for (let col = 0; col < GRID_SIZE; col++) {
          ctx.fillStyle = ELEMENTS[grid[row][col]].colour;
          ctx.fillRect(col * CELL_PIXELS, row * CELL_PIXELS, CELL_PIXELS, CELL_PIXELS);
          ctx.strokeStyle = "#ddd";
          ctx.strokeRect(col * CELL_PIXELS, row * CELL_PIXELS, CELL_PIXELS, CELL_PIXELS);
        }
      }
      showCounts();
    }

    function showCounts() {
      const totals = new Array(ELEMENTS.length).fill(0);
      for (const row of grid) for (const cell of row) totals[cell]++;
      document.getElementById("counts").textContent =
        ELEMENTS.slice(1).map(e => e.name + ": " + totals[e.id] + " cells").join("   ");
    }

    // ---- Shapes -------------------------------------------------------------
    // A shape is a function that says whether the cell at (row, col) is inside the shape,
    // for a box that is `height` rows tall and `width` columns wide. (0,0) is the box's top-left.
    function insideRounded(row, col, height, width) {
      const radius = Math.max(1, Math.min(4, Math.floor(Math.min(height, width) / 3)));
      // Which corner are we near? If not near any, the cell is inside.
      const nearTop = row < radius, nearBottom = row >= height - radius;
      const nearLeft = col < radius, nearRight = col >= width - radius;
      if (!((nearTop || nearBottom) && (nearLeft || nearRight))) return true;
      const centreRow = nearTop ? radius - 0.5 : height - radius - 0.5;
      const centreCol = nearLeft ? radius - 0.5 : width - radius - 0.5;
      const dRow = row - centreRow, dCol = col - centreCol;
      return dRow * dRow + dCol * dCol <= radius * radius;
    }

    // Wide at the top, narrower at the bottom (like the metal shell of a D-sub connector).
    function insideTrapezoid(row, col, height, width) {
      const maxInset = Math.max(1, Math.round(width * 0.15));
      const inset = Math.round(maxInset * (row / Math.max(1, height - 1)));
      return col >= inset && col < width - inset;
    }

    const SHAPES = [
      { name: "Freehand", inside: null },
      { name: "Rectangle", inside: () => true },
      { name: "Rounded rectangle", inside: insideRounded },
      { name: "Circle / oval", inside: (row, col, height, width) => {
          const x = (col + 0.5 - width / 2) / (width / 2);
          const y = (row + 0.5 - height / 2) / (height / 2);
          return x * x + y * y <= 1;
      } },
      { name: "D-shape", inside: (row, col, h, w) =>
          insideTrapezoid(row, col, h, w) && insideRounded(row, col, h, w) },
      { name: "Trapezoid", inside: insideTrapezoid },
    ];
    let selectedShape = SHAPES[0];

    // Paint a shape into the grid, filling the box between two corner cells.
    function stampShape(shape, startRow, startCol, endRow, endCol, elementId, filled) {
      const top = Math.min(startRow, endRow), bottom = Math.max(startRow, endRow);
      const left = Math.min(startCol, endCol), right = Math.max(startCol, endCol);
      const height = bottom - top + 1, width = right - left + 1;
      const isIn = (r, c) =>
        r >= 0 && r < height && c >= 0 && c < width && shape.inside(r, c, height, width);
      for (let r = 0; r < height; r++) {
        for (let c = 0; c < width; c++) {
          if (!isIn(r, c)) continue;
          // For an outline, only keep cells that touch the outside of the shape.
          const onEdge = !isIn(r - 1, c) || !isIn(r + 1, c) || !isIn(r, c - 1) || !isIn(r, c + 1);
          if (filled || onEdge) grid[top + r][left + c] = elementId;
        }
      }
    }

    // ---- Mouse / touch ------------------------------------------------------
    // Which cell is the pointer over? (Clamped so dragging off the edge still works.)
    function cellAt(event) {
      const box = canvas.getBoundingClientRect();
      const scale = canvas.width / box.width;  // canvas may be shrunk on small screens
      const col = Math.floor((event.clientX - box.left) * scale / CELL_PIXELS);
      const row = Math.floor((event.clientY - box.top) * scale / CELL_PIXELS);
      return {
        row: Math.min(GRID_SIZE - 1, Math.max(0, row)),
        col: Math.min(GRID_SIZE - 1, Math.max(0, col)),
      };
    }

    let painting = false;
    let dragStart = null;      // where a shape drag began
    let gridBeforeDrag = null; // copy of the grid so the shape preview can be redrawn

    function copyGrid(source) { return source.map(row => row.slice()); }

    function updateShapePreview(event) {
      const cell = cellAt(event);
      grid = copyGrid(gridBeforeDrag);
      stampShape(selectedShape, dragStart.row, dragStart.col, cell.row, cell.col,
                 selectedId, document.getElementById("filled").checked);
      draw();
    }

    // Paint a round blob of cells centred on (row, col), as wide as the brush size.
    function paintBrush(row, col) {
      const size = Number(document.getElementById("brushSize").value);
      const first = -Math.floor(size / 2);          // first cell offset from the centre
      const middle = first + size / 2;              // middle of the brush
      const radius = size / 2 - 0.1;
      for (let dr = first; dr < first + size; dr++) {
        for (let dc = first; dc < first + size; dc++) {
          const y = dr + 0.5 - middle, x = dc + 0.5 - middle;
          if (size > 2 && x * x + y * y > radius * radius) continue;  // trim square corners
          const r = row + dr, c = col + dc;
          if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) grid[r][c] = selectedId;
        }
      }
    }

    // Paint from the previous cell to this one so fast drags leave no gaps.
    let lastCell = null;
    function paintLineTo(cell) {
      const from = lastCell || cell;
      const steps = Math.max(Math.abs(cell.row - from.row), Math.abs(cell.col - from.col), 1);
      for (let i = 1; i <= steps; i++) {
        paintBrush(Math.round(from.row + (cell.row - from.row) * i / steps),
                   Math.round(from.col + (cell.col - from.col) * i / steps));
      }
      lastCell = cell;
      draw();
    }

    canvas.addEventListener("pointerdown", e => {
      painting = true;
      if (selectedShape.inside) {
        dragStart = cellAt(e);
        gridBeforeDrag = copyGrid(grid);
        updateShapePreview(e);
      } else {
        lastCell = null;
        paintLineTo(cellAt(e));
      }
    });
    canvas.addEventListener("pointermove", e => {
      if (!painting) return;
      if (selectedShape.inside) {
        updateShapePreview(e);
      } else {
        paintLineTo(cellAt(e));
      }
    });
    window.addEventListener("pointerup", () => { painting = false; dragStart = null; });

    // Build the element buttons.
    const toolsDiv = document.getElementById("tools");
    for (const element of ELEMENTS) {
      const button = document.createElement("button");
      button.className = "tool" + (element.id === selectedId ? " selected" : "");
      button.textContent = element.name;
      button.style.background = element.colour;
      button.style.color = element.text;
      button.addEventListener("click", () => {
        selectedId = element.id;
        for (const b of toolsDiv.children) b.classList.remove("selected");
        button.classList.add("selected");
      });
      toolsDiv.appendChild(button);
    }

    // Build the shape buttons (placed before the "Filled" checkbox).
    const shapesDiv = document.getElementById("shapes");
    const filledLabel = shapesDiv.querySelector("label");
    for (const shape of SHAPES) {
      const button = document.createElement("button");
      button.className = "shape" + (shape === selectedShape ? " selected" : "");
      button.textContent = shape.name;
      button.addEventListener("click", () => {
        selectedShape = shape;
        for (const b of shapesDiv.querySelectorAll("button")) b.classList.remove("selected");
        button.classList.add("selected");
      });
      shapesDiv.insertBefore(button, filledLabel);
    }

    document.getElementById("clear").addEventListener("click", () => {
      makeEmptyGrid();
      draw();
    });

    makeEmptyGrid();
    draw();
  </script>
</body>
</html>
